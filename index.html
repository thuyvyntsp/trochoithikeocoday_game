<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kéo co dây - Pơlong dui tơlei | Tug of War</title>
    <style>
        :root {
            --primary-color: #f1c40f;
            --secondary-color: #e67e22;
            --team-a-color: #3498db;
            --team-b-color: #e74c3c;
            --bg-overlay: rgba(255, 255, 255, 0.95);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden;
            background-color: #333;
        }

        /* MÀN HÌNH */
        .screen {
            position: absolute; width: 100%; height: 100%; display: none;
            flex-direction: column; align-items: center; justify-content: flex-start;
            background-image: url('bg.png'); background-size: cover; background-position: center;
        }

        #setup-screen { display: flex; justify-content: center; align-items: center; }

        .container {
            background: var(--bg-overlay); padding: 20px 40px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); max-width: 580px; width: 90%;
            text-align: center; z-index: 2; max-height: 90vh; overflow-y: auto;
        }

        .setting-group { margin: 10px 0; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        select, input, textarea {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box;
        }

        .lang-switch {
            display: flex; justify-content: flex-end; align-items: center; margin-bottom: 10px; gap: 8px;
        }
        .lang-btn {
            padding: 5px 12px; border-radius: 15px; border: 1px solid var(--secondary-color);
            background: #fff; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s;
        }
        .lang-btn.active { background: var(--secondary-color); color: white; }

        .btn {
            padding: 12px 25px; font-size: 18px; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.2s; font-weight: bold; margin: 5px 0;
        }
        .btn-start { background: #2ecc71; color: white; width: 100%; }
        .btn-history { background: #9b59b6; color: white; width: 100%; }
        .btn-pause { background: #f39c12; color: white; padding: 5px 15px; font-size: 14px; margin-left: 10px; }

        #info-btn {
            width: 35px; height: 35px; border-radius: 50%; background: white;
            color: #333; font-weight: bold; font-size: 20px; font-style: italic;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s; margin-left: 10px; pointer-events: auto;
        }
        #info-btn:hover { transform: scale(1.1); background: var(--primary-color); }

        /* THỐNG KÊ */
        .stats-bar {
            position: absolute; top: 10px; width: 95%; display: flex;
            justify-content: space-between; align-items: center; z-index: 20; pointer-events: none;
        }
        .stats-bar > * { pointer-events: auto; }
        .stat-card {
            background: rgba(255,255,255,0.9); padding: 8px 15px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-weight: bold; font-size: 14px;
        }

        /* STEAL AREA */
        .buzz-area { display: none; gap: 20px; margin: 15px 0; justify-content: center; }
        .btn-buzz {
            width: 220px; height: 90px; font-size: 18px; border-radius: 15px;
            color: white; text-transform: uppercase; cursor: pointer; border: 4px solid rgba(255,255,255,0.3);
            font-weight: bold;
        }
        .buzz-a { background: var(--team-a-color); box-shadow: 0 6px #2980b9; }
        .buzz-b { background: var(--team-b-color); box-shadow: 0 6px #c0392b; }

        /* BỐ CỤC CÂU HỎI & VÙNG CHƠI */
        .question-box {
            background: var(--bg-overlay); padding: 20px; border-radius: 15px;
            width: 85%; max-width: 700px; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center; z-index: 10; margin-top: 60px;
        }

        .rope-area {
            position: absolute; bottom: 0; width: 80%; height: 45vh;
            display: flex; justify-content: center; align-items: flex-end;
            overflow: hidden; z-index: 5;
        }

        .tug-container {
            position: relative; display: flex; align-items: center; justify-content: center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); width: 1200px;
        }

        .team-img { width: 600px; height: auto; object-fit: contain; transform: translateY(30px); opacity: 1 !important; }
        .center-mark { position: absolute; left: 50%; bottom: 0; width: 4px; height: 100%; background: red; z-index: 4; }

        /* OVERLAYS */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); color: white; z-index: 1000;
            align-items: center; justify-content: center; flex-direction: column; text-align: center;
        }

        .explanation {
            margin-top: 10px; padding: 10px; border-radius: 8px;
            background: #fff3cd; color: #856404; display: none; font-weight: bold;
        }

        .info-container {
            background: white; color: #333; text-align: left; padding: 30px;
            border-radius: 20px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="countdown-overlay" class="overlay" style="font-size: 150px;">3</div>
    
    <div id="pause-overlay" class="overlay">
        <h1 id="pause-title">ĐÃ TẠM DỪNG</h1>
        <button class="btn btn-start" style="width: 200px;" onclick="togglePause()" id="btn-resume">TIẾP TỤC</button>
    </div>

    <!-- POPUP INFO -->
    <div id="info-modal" class="overlay">
        <div class="info-container" id="info-content">
            <!-- Content loaded dynamically via JS -->
        </div>
    </div>

    <!-- CÀI ĐẶT -->
    <div id="setup-screen" class="screen">
        <div class="container">
            <div class="lang-switch">

                <button class="lang-btn active" id="lang-vi-btn" onclick="setLanguage('vi')">VIE 🇻🇳</button>
                <button class="lang-btn" id="lang-en-btn" onclick="setLanguage('en')">ENG 🇬🇧</button>
            </div>

            <h1 style="color: var(--secondary-color); margin: 0 0 10px 0;">PƠLONG DUI TƠLEI</h1>
            
            <div class="setting-group">
                <label id="lbl-q-source">Nguồn câu hỏi:</label>
                <select id="q-source" onchange="toggleQSource()">
                    <option value="ai" id="opt-src-ai">AI Tự tạo câu hỏi</option>
                    <option value="manual" id="opt-src-manual">Tự nhập danh sách</option>
                </select>
            </div>

            <div id="ai-config">

                    <label id="lbl-grade-topic">Lớp & Chủ đề:</label>

                        <option value="2">Lớp 2 / Grade 2</option>
                        <option value="3">Lớp 3 / Grade 3</option>
                        <option value="4">Lớp 4 / Grade 4</option>
                        <option value="5">Lớp 5 / Grade 5</option>
                    </select>
                    <select id="topic-select" style="margin-top:5px;"></select>
                </div>
            </div>

            <div id="manual-settings" style="display:none;">
                <textarea id="manual-data" rows="4" placeholder="Question|Answer (e.g: 10 + 5|15)"></textarea>
            </div>

            <div class="setting-group">
                <label id="lbl-mode-time">Chế độ & Thời gian:</label>
                <div style="display: flex; gap: 10px;">
                    <select id="play-mode" style="flex: 2;">
                        <option value="2p" id="opt-mode-2p">2 Người (Có giành quyền trả lời)</option>
                        <option value="1p" id="opt-mode-1p">1 Người (Đấu với Máy)</option>
                    </select>
                    <input type="number" id="time-per-question" value="15" style="flex: 1;">
                </div>
            </div>

            <button class="btn btn-start" onclick="startGame()" id="btn-start-game">BẮT ĐẦU CHƠI</button>
            <button class="btn btn-history" onclick="showHistory()" id="btn-view-history">LỊCH SỬ KẾT QUẢ</button>
        </div>
    </div>

    <!-- MÀN CHƠI -->
    <div id="game-screen" class="screen">
        <div class="stats-bar">
            <div class="stat-card" style="color: var(--team-a-color);">
                <span id="txt-team-a">Đội A</span>: <span id="s-a-c">0</span> <span id="txt-correct-a">Đ</span> | <span id="s-a-w">0</span> <span id="txt-wrong-a">S</span>
            </div>
            <div style="display: flex; align-items: center;">
                <div id="timer-display" style="font-size: 30px; font-weight: bold; background: white; padding: 5px 20px; border-radius: 20px;">15</div>
                <button class="btn btn-pause" onclick="togglePause()" id="btn-game-pause">Pause</button>
            </div>
            <div style="display: flex; align-items: center;">
                <div class="stat-card" style="color: var(--team-b-color);">
                    <span id="txt-team-b">Đội B</span>: <span id="s-b-c">0</span> <span id="txt-correct-b">Đ</span> | <span id="s-b-w">0</span> <span id="txt-wrong-b">S</span>
                </div>
                <div id="info-btn" onclick="toggleInfo()">i</div>
            </div>
        </div>
        
        <div class="question-box">
            <div id="turn-info" style="font-weight: bold; color: #555; margin-bottom: 5px;"></div>
            <h2 id="question-text">Câu hỏi...</h2>
            
            <div class="buzz-area" id="buzz-area">
                <button id="btn-buzz-a" class="btn-buzz buzz-a" onclick="buzzIn('A')">A GIÀNH QUYỀN TRẢ LỜI!</button>
                <button id="btn-buzz-b" class="btn-buzz buzz-b" onclick="buzzIn('B')">B GIÀNH QUYỀN TRẢ LỜI!</button>
            </div>

            <div id="answer-section" style="display: none; gap: 10px; justify-content: center; flex-direction: column;">
                <div id="answering-display" style="font-weight:bold; color: red;"></div>
                <div>
                    <input type="text" id="answer-input" placeholder="Đáp án..." style="width: 160px;" onkeyup="if(event.key==='Enter') submitAnswer()">
                    <button class="btn" style="background:#27ae60; color:white; padding: 10px 20px;" onclick="submitAnswer()" id="btn-submit">GỬI</button>
                </div>
            </div>
            <div id="explanation-text" class="explanation"></div>
        </div>

        <div class="rope-area">
            <div class="center-mark"></div>
            <div class="tug-container" id="tug-group">
                <img src="team.png" alt="Teams" class="team-img">
            </div>
        </div>
    </div>

    <!-- LỊCH SỬ -->

            <div id="history-list" style="max-height: 350px; overflow-y: auto; background: white; padding: 10px; border-radius: 8px;"></div>
            <button class="btn" style="background: #95a5a6; color: white; width:100%; margin-top: 10px;" onclick="closeHistory()" id="btn-close-history">ĐÓNG</button>
            <button class="btn" style="background: #e74c3c; color: white; width:100%; margin-top:5px;" onclick="clearHistory()" id="btn-clear-history">XÓA TẤT CẢ</button>
        </div>
    </div>

    <audio id="sound-correct" src="dung.mp3"></audio>
    <audio id="sound-wrong" src="sai.mp3"></audio>
    <audio id="bg-music" src="audio.mp3" loop></audio>

        let isPaused = false, answeringTeam = null, stealMode = false, stealTimer = null;

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-vi-btn').classList.toggle('active', lang === 'vi');
            document.getElementById('lang-en-btn').classList.toggle('active', lang === 'en');
            
            const t = i18n[lang];
            document.title = t.title;
            document.getElementById('lbl-q-source').innerText = t.lblQSource;
            document.getElementById('opt-src-ai').innerText = t.optSrcAI;
            document.getElementById('opt-src-manual').innerText = t.optSrcManual;
            document.getElementById('lbl-grade-topic').innerText = t.lblGradeTopic;
            document.getElementById('lbl-mode-time').innerText = t.lblModeTime;
            document.getElementById('opt-mode-2p').innerText = t.optMode2p;
            document.getElementById('opt-mode-1p').innerText = t.optMode1p;
            document.getElementById('btn-start-game').innerText = t.btnStartGame;
            document.getElementById('btn-view-history').innerText = t.btnViewHistory;
            
            document.getElementById('txt-team-a').innerText = t.teamA;
            document.getElementById('txt-team-b').innerText = t.teamB;
            document.getElementById('txt-correct-a').innerText = t.correctSymbol;
            document.getElementById('txt-wrong-a').innerText = t.wrongSymbol;
            document.getElementById('txt-correct-b').innerText = t.correctSymbol;
            document.getElementById('txt-wrong-b').innerText = t.wrongSymbol;
            document.getElementById('btn-game-pause').innerText = t.btnPause;

            document.getElementById('pause-title').innerText = t.pauseTitle;
            document.getElementById('btn-resume').innerText = t.btnResume;
            document.getElementById('btn-submit').innerText = t.btnSubmit;
            document.getElementById('answer-input').placeholder = t.ansPlaceholder;
            document.getElementById('manual-data').placeholder = t.manualPlaceholder;

            document.getElementById('history-title').innerText = t.historyTitle;
            document.getElementById('btn-close-history').innerText = t.btnCloseHistory;
            document.getElementById('btn-clear-history').innerText = t.btnClearHistory;

            document.getElementById('info-content').innerHTML = t.infoHTML;

            updateTopics();
        }

        function createMathProblem(grade, topic) {
            let n1, n2, q, a, e;
            const isVi = (currentLang === 'vi');

            switch (grade) {
                case "1":
                    n1 = Math.floor(Math.random() * 50);
                    n2 = Math.floor(Math.random() * 40);
                    q = `${n1} + ${n2}`; a = n1 + n2;
                    e = isVi ? "Thực hiện cộng hàng đơn vị trước." : "Add the ones column first.";
                    break;
                case "2":
                    if (topic.includes("nhân") || topic.toLowerCase().includes("multiplication")) {
                        n1 = [2, 5][Math.floor(Math.random() * 2)];
                        n2 = Math.floor(Math.random() * 9) + 1;
                        q = `${n1} x ${n2}`; a = n1 * n2;
                        e = isVi ? `Bảng nhân ${n1}.` : `Multiplication table of ${n1}.`;
                    } else {
                        n1 = Math.floor(Math.random() * 50) + 20;
                        n2 = Math.floor(Math.random() * 19) + 1;
                        q = `${n1} - ${n2}`; a = n1 - n2;
                        e = isVi ? "Trừ lần lượt từ phải sang trái." : "Subtract numbers from right to left.";
                    }
                    break;
                case "3":
                    if (topic.includes("Diện tích") || topic.toLowerCase().includes("area")) {
                        n1 = Math.floor(Math.random() * 8) + 2;
                        q = isVi ? `Diện tích hình vuông cạnh ${n1}cm là? (cm2)` : `Area of a square with side ${n1}cm? (cm2)`;
                        a = n1 * n1;
                        e = isVi ? "Diện tích = Cạnh x Cạnh." : "Area = Side x Side.";
                    } else {
                        n1 = Math.floor(Math.random() * 9) + 1;
                        n2 = Math.floor(Math.random() * 9) + 1;
                        q = `${n1} x ${n2}`; a = n1 * n2;
                        e = isVi ? "Dựa vào bảng cửu chương." : "Use multiplication tables.";
                    }
                    break;
                case "4":
                    if (topic.includes("Trung bình") || topic.toLowerCase().includes("average")) {
                        n1 = Math.floor(Math.random() * 50) * 2;
                        n2 = Math.floor(Math.random() * 50) * 2;
                        q = isVi ? `Trung bình cộng của ${n1} và ${n2} là?` : `Average of ${n1} and ${n2}?`;
                        a = (n1 + n2) / 2;
                        e = isVi ? "(Tổng hai số) : 2." : "(Sum of numbers) ÷ 2.";
                    } else {
                        n1 = Math.floor(Math.random() * 100) + 100;
                        n2 = Math.floor(Math.random() * 90) + 10;
                        q = `${n1} + ${n2}`; a = n1 + n2;
                        e = isVi ? "Cộng các hàng tương ứng." : "Add corresponding digits.";
                    }
                    break;
                case "5":
                    if (topic.includes("thập phân") || topic.toLowerCase().includes("decimal")) {
                        n1 = (Math.random() * 10).toFixed(1);
                        n2 = (Math.random() * 10).toFixed(1);
                        q = `${n1} + ${n2}`; a = (parseFloat(n1) + parseFloat(n2)).toFixed(1);
                        e = isVi ? "Cộng phần thập phân với nhau." : "Add decimal parts together.";
                    } else {
                        n1 = Math.floor(Math.random() * 5) + 1;
                        n2 = 10;
                        q = `${n1} : ${n2}`; a = (n1 / n2).toFixed(1);
                        e = isVi ? "Dời dấu phẩy sang trái 1 chữ số." : "Move decimal point one position to the left.";
                    }
                    break;
                default:
                    q = "1 + 1"; a = 2; e = isVi ? "Cơ bản." : "Basic math.";
            }
            return { q: q.includes("?") ? q : q + " = ?", a: a.toString(), e: e };
        }

        function generateAIQuestions(grade, topic, count) {
            let qSet = [];
            while (qSet.length < count) {
                try {
                    let prob = createMathProblem(grade, topic);
                    qSet.push(prob);
                } catch(err) { console.log("Skip error question", err); }
            }
            return qSet;
        }

        function updateTopics() {
            const g = document.getElementById('grade-select').value;
            const ts = document.getElementById('topic-select');
            ts.innerHTML = "";
            const currentList = topicsData[currentLang][g] || topicsData['vi'][g];
            currentList.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t; opt.innerText = t;
                ts.appendChild(opt);
            });
        }

        function toggleQSource() {
            const isAI = document.getElementById('q-source').value === 'ai';
            document.getElementById('ai-config').style.display = isAI ? 'block' : 'none';
            document.getElementById('manual-settings').style.display = isAI ? 'none' : 'block';
        }

        function toggleInfo() {
            const modal = document.getElementById('info-modal');
            const showing = modal.style.display === 'flex';
            modal.style.display = showing ? 'none' : 'flex';
            if (gameActive) isPaused = !showing;
        }

        function startGame() {
            const source = document.getElementById('q-source').value;
            const grade = document.getElementById('grade-select').value;
            const topic = document.getElementById('topic-select').value;
            const t = i18n[currentLang];
            
            if (source === 'manual') {
                const text = document.getElementById('manual-data').value.trim();
                if (!text) return alert(t.alertNoQuestion);
                questions = text.split('\n').filter(l => l.includes('|')).map(l => ({
                    q: l.split('|')[0].trim(),
                    a: l.split('|')[1].trim(),
                    e: currentLang === 'vi' ? "Đáp án đã nhập tay." : "Custom entered answer."
                }));
            } else {
                questions = generateAIQuestions(grade, topic, 10);
            }

            stats = { A: { c: 0, w: 0, wQs: [] }, B: { c: 0, w: 0, wQs: [] } };
            currentQIndex = 0; pullScore = 0; updateStatsUI(); updateTugUI();
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            const music = document.getElementById('bg-music');
            music.volume = 0.4;
            music.play().catch(() => {});
            
            runCountdown();
        }

        function runCountdown() {
            const overlay = document.getElementById('countdown-overlay');
            const t = i18n[currentLang];
            let c = 3; overlay.style.display = 'flex'; overlay.innerText = c;
            let inter = setInterval(() => {
                c--;
                if (c > 0) overlay.innerText = c;
                else if (c === 0) overlay.innerText = t.startText;
                else { clearInterval(inter); overlay.style.display = 'none'; gameActive = true; nextQuestion(); }
            }, 1000);
        }

        function nextQuestion() {
            if (currentQIndex >= questions.length || Math.abs(pullScore) >= 5) return endGame();
            stealMode = false; clearTimeout(stealTimer);
            answeringTeam = (currentQIndex % 2 === 0) ? 'A' : 'B';
            const t = i18n[currentLang];
            const teamName = answeringTeam === 'A' ? t.teamA : t.teamB;
            
            document.getElementById('explanation-text').style.display = 'none';
            document.getElementById('answer-input').value = '';
            document.getElementById('question-text').innerText = questions[currentQIndex].q;
            document.getElementById('buzz-area').style.display = 'none';
            document.getElementById('answer-section').style.display = 'flex';
            
            const mode = document.getElementById('play-mode').value;
            if (mode === '1p' && answeringTeam === 'B') {
                document.getElementById('answering-display').innerText = t.aiAnswering;
                document.getElementById('answer-input').disabled = true;
                setTimeout(aiLogic, 2000);
            } else {
                document.getElementById('answering-display').innerText = `${t.turnText}${teamName}`;
                document.getElementById('answer-input').disabled = false;
                document.getElementById('answer-input').focus();
            }

            timeLeft = parseInt(document.getElementById('time-per-question').value) || 15;
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            document.getElementById('timer-display').innerText = timeLeft;
            timer = setInterval(() => {
                if (!isPaused) {
                    timeLeft--;
                    document.getElementById('timer-display').innerText = timeLeft;
                    if (timeLeft <= 0) { clearInterval(timer); handleWrong(); }
                }
            }, 1000);
        }

        function aiLogic() {
            if (!gameActive || isPaused) return;
            const isCorrect = Math.random() < 0.7;
            if (isCorrect) {
                document.getElementById('answer-input').value = questions[currentQIndex].a;
                submitAnswer();
            } else handleWrong();
        }

        function submitAnswer() {
            if (!gameActive || isPaused) return;
            const ans = document.getElementById('answer-input').value.trim();
            if (!ans) return;
            if (ans.toLowerCase() === questions[currentQIndex].a.toLowerCase()) handleCorrect();
            else handleWrong();
        }

        function handleCorrect() {
            clearInterval(timer); playEffect('correct');
            stats[answeringTeam].c++;
            if (answeringTeam === 'A') pullScore++; else pullScore--;
            updateStatsUI(); updateTugUI();
            setTimeout(() => { currentQIndex++; nextQuestion(); }, 1200);
        }

        function handleWrong() {
            clearInterval(timer); playEffect('wrong');
            stats[answeringTeam].w++;
            stats[answeringTeam].wQs.push({ q: questions[currentQIndex].q, a: questions[currentQIndex].a });
            updateStatsUI();

            const mode = document.getElementById('play-mode').value;
            const t = i18n[currentLang];
            const currentTeamName = answeringTeam === 'A' ? t.teamA : t.teamB;

            if (!stealMode && mode === '2p') {
                stealMode = true;
                const otherTeam = (answeringTeam === 'A') ? 'B' : 'A';
                const otherTeamName = otherTeam === 'A' ? t.teamA : t.teamB;

                document.getElementById('answer-section').style.display = 'none';
                document.getElementById('buzz-area').style.display = 'flex';
                
                const btnA = document.getElementById('btn-buzz-a');
                const btnB = document.getElementById('btn-buzz-b');
                
                btnA.style.display = (otherTeam === 'A') ? 'block' : 'none';
                btnB.style.display = (otherTeam === 'B') ? 'block' : 'none';
                btnA.innerText = `${t.teamA}${t.buzzText}`;
                btnB.innerText = `${t.teamB}${t.buzzText}`;

                document.getElementById('turn-info').innerText = `${currentTeamName}${t.wrongStealText.replace('{team}', otherTeamName)}`;
                stealTimer = setTimeout(() => { showFinalExplanation(); }, 5000);
            } else {
                showFinalExplanation();
            }
        }

        function buzzIn(team) {
            clearTimeout(stealTimer);
            answeringTeam = team; playEffect('correct');
            const t = i18n[currentLang];
            const teamName = team === 'A' ? t.teamA : t.teamB;

            document.getElementById('buzz-area').style.display = 'none';
            document.getElementById('answer-section').style.display = 'flex';
            document.getElementById('answering-display').innerText = `${teamName}${t.stoleText}`;
            document.getElementById('answer-input').disabled = false;
            document.getElementById('answer-input').focus();
        }

        function showFinalExplanation() {
            clearTimeout(stealTimer);
            const t = i18n[currentLang];
            const exp = document.getElementById('explanation-text');
            exp.innerHTML = `${t.correctAnswerIs} ${questions[currentQIndex].a}<br>${questions[currentQIndex].e}`;
            exp.style.display = 'block';
            document.getElementById('buzz-area').style.display = 'none';
            document.getElementById('answer-section').style.display = 'none';
            setTimeout(() => { currentQIndex++; nextQuestion(); }, 3000);
        }

        function togglePause() { 
            isPaused = !isPaused; 
            document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none'; 
        }

        function updateStatsUI() {
            document.getElementById('s-a-c').innerText = stats.A.c; 
            document.getElementById('s-a-w').innerText = stats.A.w;
            document.getElementById('s-b-c').innerText = stats.B.c; 
            document.getElementById('s-b-w').innerText = stats.B.w;
        }

        function updateTugUI() { 
            document.getElementById('tug-group').style.transform = `translateX(${-pullScore * 60}px)`; 
        }

        function playEffect(t) { 
            const s = document.getElementById(t === 'correct' ? 'sound-correct' : 'sound-wrong'); 
            if (s) { s.volume = 1; s.currentTime = 0; s.play().catch(()=>{}); } 
        }

        function endGame() {
            gameActive = false; clearInterval(timer);
            const t = i18n[currentLang];
            let winner = t.teamA;
            if (pullScore < 0) winner = t.teamB;
            else if (pullScore === 0) {
                winner = (stats.A.c > stats.B.c) ? t.teamA : (stats.B.c > stats.A.c ? t.teamB : (currentLang==='vi'?'Hòa':'Tie'));
            }

            const h = JSON.parse(localStorage.getItem('tug_history') || "[]");
            h.unshift({ date: new Date().toLocaleString(), winner, statsA: stats.A, statsB: stats.B });
            localStorage.setItem('tug_history', JSON.stringify(h));

            alert(t.winnerAlert.replace('{winner}', winner));
            location.reload();
        }

        function showHistory() {
            const t = i18n[currentLang];
            const h = JSON.parse(localStorage.getItem('tug_history') || "[]");
            let html = "";
            h.forEach(r => {
                html += `<div style="border-bottom:1px solid #ccc; padding:10px; background:#f9f9f9; margin-bottom:5px; border-radius: 5px;">
                    <b>${r.date}</b> - ${currentLang==='vi'?'Thắng':'Winner'}: <span style="color:red; font-weight:bold;">${r.winner}</span><br>
                    ${t.teamA}: ${r.statsA.c} ${t.correctSymbol} / ${r.statsA.w} ${t.wrongSymbol} | ${t.teamB}: ${r.statsB.c} ${t.correctSymbol} / ${r.statsB.w} ${t.wrongSymbol}
                </div>`;
            });
            document.getElementById('history-list').innerHTML = html || t.noHistory;
            document.getElementById('history-modal').style.display = 'flex';
        }

        function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }
        
        function clearHistory() { 
            const t = i18n[currentLang];
            if(confirm(t.confirmClearHistory)) { 
                localStorage.removeItem('tug_history'); 
                showHistory(); 
            } 
        }
        
        window.onload = () => {
            setLanguage('vi');
            const c = localStorage.getItem('tug_manual_cache');
            if (c) document.getElementById('manual-data').value = c;
        };
    </script>
</body>
</html>
